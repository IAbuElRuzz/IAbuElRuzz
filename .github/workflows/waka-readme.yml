name: Waka Readme

on:
  workflow_dispatch: # for manual workflow trigger
  schedule:
    - cron: "0 0 * * *" # runs at every 12AM UTC

jobs:
  update-readme:
    name: WakaReadme DevMetrics
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Each invocation waits about five minutes for WakaTime to calculate stats.
      # Retry failed invocations to allow more time for all-time stats to finish.
      - name: Update WakaTime stats (attempt 1)
        id: waka_first
        continue-on-error: true
        uses: IAbuElRuzz/waka-readme@master
        with:
          # Store a WakaTime OAuth token (https://wakatime.com/oauth) in this secret.
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: true
          BLOCKS: ->
          TIME_RANGE: all_time
          SHOW_TIME: true
          SHOW_MASKED_TIME: true

      - name: Update WakaTime stats (attempt 2)
        if: ${{ steps.waka_first.outcome == 'failure' }}
        id: waka_second
        continue-on-error: true
        uses: IAbuElRuzz/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: true
          BLOCKS: ->
          TIME_RANGE: all_time
          SHOW_TIME: true
          SHOW_MASKED_TIME: true

      - name: Update WakaTime stats (final attempt)
        if: ${{ steps.waka_second.outcome == 'failure' }}
        uses: IAbuElRuzz/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: true
          BLOCKS: ->
          TIME_RANGE: all_time
          SHOW_TIME: true
          SHOW_MASKED_TIME: true
